intended_difficulty_bands:
  - band: 1
    name: Direct
    description: One clear operation, little context, and easily verifiable output.
    accepted_target_percent: 20
  - band: 2
    name: Composed
    description: Two or three dependent operations with multiple grading criteria.
    accepted_target_percent: 20
  - band: 3
    name: Multi-step
    description: Four or more meaningful operations across constraints or artifacts.
    accepted_target_percent: 20
  - band: 4
    name: Investigative
    description: Locate, compare, and synthesize substantial local evidence.
    accepted_target_percent: 20
  - band: 5
    name: Constraint-heavy
    description: Long dependency chains, interacting constraints, and recovery checks.
    accepted_target_percent: 20

grading_types:
  automated:
    target_percent: 70
    description: Objective grader snippet only.
  hybrid:
    target_percent: 25
    description: Automated checks plus a judge rubric for qualitative aspects.
  llm_judge:
    max_percent: 5
    description: Judge rubric only, used where objective grading is not reliable.
